<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="ResearchMind: chat with your research papers. Answers are grounded in your documents with page-level citations." />
  <title>ResearchMind · Chat with your papers</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237c5cff'/%3E%3Cstop offset='1' stop-color='%2306b6d4'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Cpath d='M10 9h9a4 4 0 0 1 0 8h-4l-5 6V9z' fill='none' stroke='white' stroke-width='2.6' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/styles.css?v=2" />
</head>
<body>
  <div class="shell">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar" aria-label="Conversations and library">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18"><path d="M5 4h9a5 5 0 0 1 0 10H9l-4 5V4z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/></svg>
        </div>
        <div>
          <span class="brand-name">ResearchMind</span>
          <span class="brand-tag">RAG research assistant</span>
        </div>
      </div>

      <button class="btn primary block" id="newChatBtn"><i data-icon="plus"></i> New chat <kbd>Ctrl K</kbd></button>

      <section class="side-section grow">
        <div class="side-heading"><span>Conversations</span></div>
        <div class="search-mini">
          <i data-icon="search"></i>
          <input id="chatSearch" placeholder="Search chats" aria-label="Search conversations" />
        </div>
        <ul class="chat-list" id="chatList"></ul>
      </section>

      <section class="side-section">
        <div class="side-heading">
          <span>Library</span>
          <span class="muted" id="libraryCount"></span>
        </div>
        <ul class="doc-list" id="docList"></ul>
        <label class="dropzone" id="dropzone">
          <i data-icon="upload"></i>
          <span><b>Upload papers</b><small>PDF, TXT, MD · drop or click</small></span>
          <input type="file" id="fileInput" accept=".pdf,.txt,.md" multiple hidden />
        </label>
        <div class="upload-queue" id="uploadQueue"></div>
      </section>

      <div class="side-footer">
        <button class="nav-btn" id="settingsBtn"><i data-icon="settings"></i> Settings</button>
        <button class="nav-btn" id="helpBtn"><i data-icon="keyboard"></i> Shortcuts <kbd>?</kbd></button>
      </div>
    </aside>
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <!-- Main -->
    <div class="main">
      <header class="topbar">
        <button class="icon-btn mobile-only" id="menuBtn" aria-label="Open menu"><i data-icon="menu"></i></button>
        <div class="topbar-title">
          <h1 id="chatTitle">New chat</h1>
          <p id="chatSubtitle">Ask anything about your papers</p>
        </div>
        <div class="status-pill" id="statusPill" title="Server status">
          <span class="status-dot"></span><span id="statusText">Connecting…</span>
        </div>
        <button class="icon-btn" id="sourcesToggle" aria-label="Toggle sources panel" title="Sources panel"><i data-icon="panel"></i></button>
        <button class="icon-btn" id="themeBtn" aria-label="Toggle theme"><i data-icon="moon"></i></button>
      </header>

      <div class="workspace">
        <main class="chat" id="chat" aria-live="polite"></main>

        <aside class="sources-panel" id="sourcesPanel" aria-label="Sources">
          <header>
            <h2><i data-icon="quote"></i> Sources</h2>
            <button class="icon-btn" id="closeSources" aria-label="Close sources"><i data-icon="x"></i></button>
          </header>
          <div id="sourcesBody" class="sources-body"></div>
        </aside>
      </div>

      <form class="composer" id="composer">
        <div class="composer-box">
          <button type="button" class="icon-btn" id="attachBtn" aria-label="Upload a paper" title="Upload a paper"><i data-icon="paperclip"></i></button>
          <textarea id="input" rows="1" placeholder="Ask about your papers…" aria-label="Your question"></textarea>
          <button type="submit" class="send-btn" id="sendBtn" aria-label="Send"><i data-icon="send"></i></button>
        </div>
        <div class="composer-hint">
          <span><kbd>Enter</kbd> to send · <kbd>Shift</kbd>+<kbd>Enter</kbd> new line</span>
          <span id="scopeHint"></span>
        </div>
      </form>

      <footer class="footer">
        <span id="footerStats"></span>
        <span class="footer-right">
          <span class="hide-mobile" id="modelInfo"></span>
          <a href="https://github.com/nausheenfarru01-sudo/rag" target="_blank" rel="noreferrer"><i data-icon="github"></i> Built by Fareeha Nausheen</a>
        </span>
      </footer>
    </div>
  </div>

  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  <div id="modalRoot"></div>
  <div class="drop-overlay" id="dropOverlay"><div><i data-icon="upload"></i><b>Drop papers to add them to your library</b></div></div>

  <script src="/static/app.js?v=2"></script>
</body>
</html>
